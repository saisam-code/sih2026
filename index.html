<script>
const SUPABASE_URL = "https://fadjizlqunpimwfjwckc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vyH0tlvbDYCzRjTFEqNBHw_RWCwe8DF";

const sbConfigured =
  SUPABASE_URL.startsWith("https://") &&
  SUPABASE_ANON_KEY &&
  !SUPABASE_URL.includes("YOUR_SUPABASE");

const sb = sbConfigured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;


/* ============================================================
   SIH JOURNEY
   ============================================================ */

const steps = [
  ["01","Problem Statement","Understand the challenge, users, context and constraints."],
  ["02","Build Your Team","Bring complementary skills together instead of duplicating the same skill."],
  ["03","Understand the Problem","Research the context before deciding what to build."],
  ["04","Develop Your Idea","Compare approaches and choose a solution that is useful and practical."],
  ["05","Build the Solution","Create a prototype/MVP, test it and improve the important parts."],
  ["06","Submit","Prepare the required submission and communicate the solution clearly."],
  ["07","Selection","Selected teams move forward according to the applicable official process."],
  ["08","Hackathon","Develop, test, refine and collaborate under hackathon conditions."],
  ["09","Pitch & Evaluation","Demonstrate the solution, explain its value and answer questions."]
];

const timeline = document.getElementById("timeline");

steps.forEach((s, i) => {
  const el = document.createElement("div");

  el.className = "step" + (i === 0 ? " active" : "");

  el.innerHTML = `
    <div class="step-num">${s[0]}</div>
    <div class="step-title">${s[1]}</div>
    <div class="step-desc">${s[2]}</div>
  `;

  el.onclick = () => {
    document.querySelectorAll(".step")
      .forEach(x => x.classList.remove("active"));

    el.classList.add("active");
  };

  timeline.appendChild(el);
});


/* ============================================================
   MULTI-CHOICE BUTTONS
   ============================================================ */

document.querySelectorAll(".options").forEach(group => {
  group.addEventListener("click", e => {
    if (!e.target.classList.contains("opt")) return;

    group.querySelectorAll(".opt")
      .forEach(x => x.classList.remove("selected"));

    e.target.classList.add("selected");
  });
});


/* ============================================================
   TEAM FINDER
   ============================================================ */

const selected = group => [
  ...document.querySelectorAll(
    `.options[data-group="${group}"] .opt.selected`
  )
].map(x => x.textContent.trim());


function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[c]));
}


function showTeamMessage(title, text, buttonHtml = "") {
  const box = document.getElementById("teamResult");

  box.innerHTML = `
    <h3>${escapeHtml(title)}</h3>
    <p>${escapeHtml(text)}</p>
    ${buttonHtml}
  `;

  box.classList.add("show");
}


async function currentUser() {
  if (!sb) return null;

  const {
    data: { user }
  } = await sb.auth.getUser();

  return user;
}


/* ============================================================
   AUTH UI
   ============================================================ */

async function refreshAuthUI() {
  const text = document.getElementById("authText");
  const authButton = document.getElementById("authButton");
  const signOut = document.getElementById("signOutButton");

  if (!sb) {
    text.textContent =
      "Connect your Supabase project in the JavaScript configuration.";

    authButton.style.display = "inline-flex";
    signOut.style.display = "none";

    return;
  }

  const user = await currentUser();

  if (user) {
    text.textContent = `Signed in as ${user.email}.`;

    authButton.style.display = "none";
    signOut.style.display = "inline-flex";

    await loadMyRequests();
  } else {
    text.textContent =
      "Sign in to save your profile and contact potential teammates.";

    authButton.style.display = "inline-flex";
    signOut.style.display = "none";
  }
}


/* ============================================================
   SIGN IN / SIGN UP
   ============================================================ */

async function signInWithEmail() {
  if (!sb) {
    showTeamMessage(
      "Supabase is not connected",
      "Check your Supabase URL and publishable key."
    );

    return;
  }

  const email = prompt("Email address:");

  if (!email) return;

  const password = prompt(
    "Password (minimum 6 characters):"
  );

  if (!password) return;

  let result = await sb.auth.signInWithPassword({
    email,
    password
  });

  /*
   * If login fails, try creating the account.
   */
  if (result.error) {
    result = await sb.auth.signUp({
      email,
      password
    });
  }

  if (result.error) {
    showTeamMessage(
      "Authentication failed",
      result.error.message
    );

    return;
  }

  showTeamMessage(
    "Signed in",
    "Your account is ready. Complete your profile and save it."
  );

  await refreshAuthUI();
}


async function signOut() {
  if (sb) {
    await sb.auth.signOut();
  }

  document.getElementById("matches").innerHTML = "";
  document.getElementById("requests").innerHTML = "";

  showTeamMessage(
    "Signed out",
    "Sign in again when you want to use team matching."
  );

  await refreshAuthUI();
}


/* ============================================================
   SAVE PROFILE
   ============================================================ */

async function saveTeamProfile() {
  const user = await currentUser();

  if (!user) {
    showTeamMessage(
      "Sign in first",
      "Create or sign in to your account so the profile can be saved and matched.",
      `<button class="btn btn-primary"
        type="button"
        onclick="signInWithEmail()">
        SIGN IN / CREATE ACCOUNT
      </button>`
    );

    return;
  }

  const name =
    document.getElementById("name").value.trim();

  const college =
    document.getElementById("college").value.trim();

  const year =
    document.getElementById("year").value;

  const experience =
    document.getElementById("experience").value;

  const skills =
    selected("skills");

  const lookingFor =
    selected("looking");

  const domains =
    selected("domains");

  const problemInterest =
    document.getElementById("interest").value.trim();


  if (
    !name ||
    !college ||
    !year ||
    !experience ||
    !skills.length ||
    !lookingFor.length ||
    !domains.length
  ) {
    showTeamMessage(
      "Complete your profile",
      "Name, college, year, experience, at least one skill, one team preference and one problem domain are required."
    );

    return;
  }


  /*
   * Save main profile
   */
  const { error: profileError } =
    await sb
      .from("profiles")
      .upsert({
        id: user.id,
        name,
        college,
        year,
        experience,
        looking_for: lookingFor,
        problem_interest: problemInterest,
        domains
      });


  if (profileError) {
    showTeamMessage(
      "Could not save profile",
      profileError.message
    );

    return;
  }


  /*
   * Replace old skills
   */
  const { error: deleteError } =
    await sb
      .from("profile_skills")
      .delete()
      .eq("profile_id", user.id);


  if (deleteError) {
    showTeamMessage(
      "Could not update skills",
      deleteError.message
    );

    return;
  }


  /*
   * Insert new skills
   */
  const { error: skillError } =
    await sb
      .from("profile_skills")
      .insert(
        skills.map(skill => ({
          profile_id: user.id,
          skill
        }))
      );


  if (skillError) {
    showTeamMessage(
      "Could not save skills",
      skillError.message
    );

    return;
  }


  showTeamMessage(
    "Profile saved",
    "Your profile is now searchable. Compatible students are shown below."
  );

  await findMatches();
  await loadMyRequests();
}


/* ============================================================
   MATCHING ALGORITHM
   ============================================================ */

function calculateMatch(me, candidate, mySkills) {

  const candidateSkills =
    (candidate.profile_skills || [])
      .map(x => x.skill);

  const mine = new Set(mySkills);

  const complementary =
    candidateSkills.filter(
      x => !mine.has(x)
    ).length;

  const myDomains =
    new Set(me.domains || []);

  const candidateDomains =
    candidate.domains || [];

  const domainOverlap =
    candidateDomains.filter(
      x => myDomains.has(x)
    ).length;


  const experienceScore =
    me.experience === candidate.experience
      ? 10
      : (
          me.experience === "Experienced" ||
          candidate.experience === "Experienced"
        )
          ? 7
          : 5;


  const lookingFor =
    Array.isArray(candidate.looking_for)
      ? candidate.looking_for
      : [];


  const preferenceScore =
    lookingFor.includes("Join a Team") ||
    lookingFor.includes("Find Teammates")
      ? 10
      : 5;


  const raw =
    45 +
    Math.min(25, complementary * 7) +
    Math.min(20, domainOverlap * 10) +
    Math.min(10, experienceScore) +
    Math.min(10, preferenceScore);


  return Math.max(
    50,
    Math.min(99, Math.round(raw))
  );
}


/* ============================================================
   FIND MATCHES
   ============================================================ */

async function findMatches() {

  const user = await currentUser();

  if (!user) return;


  const {
    data: me,
    error: meError
  } = await sb
    .from("profiles")
    .select(`
      id,
      name,
      college,
      year,
      experience,
      looking_for,
      problem_interest,
      domains
    `)
    .eq("id", user.id)
    .single();


  if (meError) {
    showTeamMessage(
      "Create your profile first",
      "Save your profile before searching for teammates."
    );

    return;
  }


  const {
    data: mySkills,
    error: mySkillsError
  } = await sb
    .from("profile_skills")
    .select("skill")
    .eq("profile_id", user.id);


  if (mySkillsError) {
    showTeamMessage(
      "Could not load your skills",
      mySkillsError.message
    );

    return;
  }


  const mySkillNames =
    (mySkills || []).map(x => x.skill);


  const {
    data: people,
    error
  } = await sb
    .from("profiles")
    .select(`
      id,
      name,
      college,
      year,
      experience,
      looking_for,
      problem_interest,
      domains,
      profile_skills(skill)
    `)
    .neq("id", user.id)
    .limit(100);


  if (error) {
    showTeamMessage(
      "Could not load matches",
      error.message
    );

    return;
  }


  const ranked =
    (people || [])
      .map(person => ({
        ...person,
        score: calculateMatch(
          me,
          person,
          mySkillNames
        )
      }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 10);


  const box =
    document.getElementById("matches");


  if (!ranked.length) {

    box.innerHTML = `
      <div class="match-card">

        <div class="section-mini">
          TEAM MATCHES
        </div>

        <div style="color:#8997a5;font-size:.8rem">
          No other student profiles are available yet.
          Share the page with students who want to form SIH teams.
        </div>

      </div>
    `;

    return;
  }


  box.innerHTML = `
    <div class="section-mini"
         style="margin-top:25px">
      TOP TEAMMATE MATCHES
    </div>

    ${ranked.map(p => {

      const skills =
        (p.profile_skills || [])
          .map(x => x.skill);

      const domains =
        (p.domains || []).join(" • ");

      return `
        <div class="match-card">

          <div class="match-top">

            <div>
              <div class="match-name">
                ${escapeHtml(p.name)}
              </div>

              <div class="match-meta">
                ${escapeHtml(p.college)}
                •
                ${escapeHtml(p.year)}
                •
                ${escapeHtml(p.experience)}
              </div>
            </div>

            <div class="match-score">
              ${p.score}% MATCH
            </div>

          </div>


          <div class="match-skills">

            ${skills.map(s => `
              <span class="match-skill">
                ${escapeHtml(s)}
              </span>
            `).join("")}

          </div>


          <div class="match-meta">
            Interested in:
            ${escapeHtml(domains || "Multiple domains")}
          </div>


          ${
            p.problem_interest
              ? `
                <div class="match-meta"
                     style="margin-top:5px">
                  Problem:
                  ${escapeHtml(p.problem_interest)}
                </div>
              `
              : ""
          }


          <div style="margin-top:13px">

            <button
              class="btn btn-primary"
              type="button"
              onclick="sendTeamRequest('${p.id}')">

              SEND TEAM REQUEST →

            </button>

          </div>

        </div>
      `;

    }).join("")}
  `;
}


/* ============================================================
   SEND TEAM REQUEST
   ============================================================ */

async function sendTeamRequest(receiverId) {

  const user = await currentUser();

  if (!user || receiverId === user.id) return;


  const {
    data: existing
  } = await sb
    .from("team_requests")
    .select("id,status")
    .eq("sender_id", user.id)
    .eq("receiver_id", receiverId)
    .maybeSingle();


  if (existing) {

    showTeamMessage(
      "Request already exists",
      `Current status: ${existing.status}.`
    );

    return;
  }


  const { error } =
    await sb
      .from("team_requests")
      .insert({
        sender_id: user.id,
        receiver_id: receiverId,
        status: "pending"
      });


  if (error) {

    showTeamMessage(
      "Request not sent",
      error.message
    );

    return;
  }


  showTeamMessage(
    "Team request sent",
    "The student can now accept or reject your request."
  );

  await loadMyRequests();
}


/* ============================================================
   REQUESTS
   ============================================================ */

async function loadMyRequests() {

  const user = await currentUser();

  if (!user) return;


  const {
    data: incoming
  } = await sb
    .from("team_requests")
    .select(`
      id,
      status,
      created_at,
      sender:profiles!team_requests_sender_id_fkey(
        name,
        college
      )
    `)
    .eq("receiver_id", user.id)
    .order("created_at", {
      ascending: false
    })
    .limit(20);


  const {
    data: outgoing
  } = await sb
    .from("team_requests")
    .select(`
      id,
      status,
      created_at,
      receiver:profiles!team_requests_receiver_id_fkey(
        name,
        college
      )
    `)
    .eq("sender_id", user.id)
    .order("created_at", {
      ascending: false
    })
    .limit(20);


  const box =
    document.getElementById("requests");


  if (
    !(incoming || []).length &&
    !(outgoing || []).length
  ) {
    box.innerHTML = "";
    return;
  }


  box.innerHTML = `

    <div class="section-mini"
         style="margin-top:28px">
      TEAM REQUESTS
    </div>


    ${(incoming || []).map(r => `

      <div class="match-card">

        <div class="match-top">

          <div>

            <div class="match-name">
              ${escapeHtml(
                r.sender?.name || "Student"
              )}
            </div>

            <div class="match-meta">
              ${escapeHtml(
                r.sender?.college || ""
              )}
              wants to connect with you.
            </div>

          </div>


          <span class="status ${escapeHtml(r.status)}">
            ${escapeHtml(
              r.status.toUpperCase()
            )}
          </span>

        </div>


        ${
          r.status === "pending"
            ? `
              <div style="margin-top:13px;
                          display:flex;
                          gap:7px;
                          flex-wrap:wrap">

                <button
                  class="btn btn-primary"
                  type="button"
                  onclick="updateRequest('${r.id}','accepted')">
                  ACCEPT
                </button>

                <button
                  class="btn btn-ghost"
                  type="button"
                  onclick="updateRequest('${r.id}','rejected')">
                  REJECT
                </button>

              </div>
            `
            : ""
        }

      </div>

    `).join("")}


    ${(outgoing || []).map(r => `

      <div class="match-card">

        <div class="match-top">

          <div>

            <div class="match-name">
              Request to
              ${escapeHtml(
                r.receiver?.name || "Student"
              )}
            </div>

            <div class="match-meta">
              ${escapeHtml(
                r.receiver?.college || ""
              )}
            </div>

          </div>


          <span class="status ${escapeHtml(r.status)}">
            ${escapeHtml(
              r.status.toUpperCase()
            )}
          </span>

        </div>

      </div>

    `).join("")}

  `;
}


/* ============================================================
   ACCEPT / REJECT
   ============================================================ */

async function updateRequest(requestId, status) {

  const user = await currentUser();

  if (!user) return;


  const { error } =
    await sb
      .from("team_requests")
      .update({ status })
      .eq("id", requestId)
      .eq("receiver_id", user.id);


  if (error) {

    showTeamMessage(
      "Could not update request",
      error.message
    );

    return;
  }


  showTeamMessage(
    status === "accepted"
      ? "Request accepted"
      : "Request rejected",

    status === "accepted"
      ? "You can now coordinate with this teammate and create your SIH team."
      : "The request was marked as rejected."
  );


  await loadMyRequests();
}

if (sb) {

/* ============================================================
   SCROLL PROGRESS
   ============================================================ */

const scrollProgress =
  document.getElementById("scrollProgress");


window.addEventListener("scroll", () => {

  const max =
    document.documentElement.scrollHeight -
    window.innerHeight;

  scrollProgress.style.width =
    (
      max > 0
        ? window.scrollY / max * 100
        : 0
    ) + "%";

}, { passive: true });


/* ============================================================
   REVEAL ANIMATION
   ============================================================ */

const observer =
  new IntersectionObserver(
    entries => {

      entries.forEach(entry => {

        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        }

      });

    },
    { threshold: 0.12 }
  );


document
  .querySelectorAll(".reveal")
  .forEach(el => observer.observe(el));

</script>
